---
- name: Update APT packages on Debian/Ubuntu
  ansible.builtin.apt:
    update_cache: true
    state: latest
    upgrade: full
    autoremove: true
  when: ansible_facts["ansible_distribution"] == "Debian" or ansible_facts["ansible_distribution"] == "Zorin OS"

- name: Update Flatpaks
  ansible.builtin.command: flatpak update --noninteractive
  register: flatpak_update_output
  changed_when: "'app/' in flatpak_update_output.stdout"
  when: ansible_facts["ansible_distribution"] == "Zorin OS"

- name: Reboot if required
  when:
    - ansible_facts["ansible_distribution"] == "Debian" or ansible_facts["ansible_distribution"] == "Zorin OS"
  block:
    - name: Check if reboot required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot if required
      ansible.builtin.reboot:
      when:
        - reboot_required_file.stat.exists

- name: Update DNF packages on Fedora
  ansible.builtin.dnf5:
    name: "*"
    state: latest

  when: ansible_facts["ansible_distribution"] == "Fedora"

- name: Remove packages that are not longer needed
  ansible.builtin.dnf5:
    autoremove: true
  when: ansible_facts["ansible_distribution"] == "Fedora"

- name: Prune unused podman images, containers, pods, networks and volumes
  containers.podman.podman_prune:
    system: true
    system_all: true # Prunes non-dangling images which occupy a lot of space
  when: inventory_hostname in groups["podman"]
  become_user: "{{ podman_user }}"
