---
- name: Create folders for Actual Budget data files
  ansible.builtin.file:
    path: "{{ podman_appdata_dir }}/actual-budget/data"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_group }}"
    mode: "0750"
- name: Create Actual Buget Quadlet
  containers.podman.podman_container:
    name: actual-budget
    image: docker.io/actualbudget/actual-server:26.8.1@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5
    state: quadlet
    quadlet_filename: actual-budget
    quadlet_file_mode: "0644"
    quadlet_dir: "{{ quadlet_dir }}"
    ports:
      - "5006:5006"
    volumes:
      - "{{ podman_appdata_dir }}/actual-budget/data:/data:Z"
    health_cmd: "node scripts/health-check.js"
    health_startup_interval: 50s
    health_startup_retries: 3
    healthcheck_start_period: 20s
    healthcheck_timeout: 10s
    healthcheck_failure_action: "kill"
    quadlet_options:
      - "NoNewPrivileges=true"
      - |
        [Service]
        Restart=always
      - |
        [Install]
        WantedBy=default.target
- name: Open firewalld port for Actual Budget
  ansible.posix.firewalld:
    port: "5006/tcp"
    permanent: true
    immediate: true
    state: enabled
  notify:
    - Reload firewalld
