---
- name: Create folder for FreshRSS data
  ansible.builtin.file:
    path: "{{ podman_appdata_dir }}/freshrss/data"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_group }}"
    mode: "0755"
- name: Copy FreshRSS environment file
  ansible.builtin.copy:
    src: freshrss.env
    dest: "{{ quadlet_dir }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_group }}"
    mode: "0600"
- name: Create FreshRSS Quadlet
  containers.podman.podman_container:
    name: freshrss
    image: docker.io/freshrss/freshrss:1.30.3@sha256:fe45c15dc79573231629588e194f142adffae6bdeae6036401011c63ba644c94
    state: quadlet
    quadlet_filename: freshrss
    quadlet_file_mode: "0644"
    quadlet_dir: "{{ quadlet_dir }}"
    ports:
      - "8089:80"
    volumes:
      - "{{ podman_appdata_dir }}/freshrss/data:/var/www/FreshRSS/data:Z"
    health_cmd: "cli/health.php"
    health_startup_interval: 11s
    health_startup_retries: 3
    healthcheck_start_period: 20s
    healthcheck_timeout: 10s
    healthcheck_failure_action: "kill"
    env_file:
      - freshrss.env
    quadlet_options:
      - "NoNewPrivileges=true"
      - |
        [Service]
        Restart=always
      - |
        [Install]
        WantedBy=default.target
- name: Open firewalld port for FreshRSS
  ansible.posix.firewalld:
    port: "8089/tcp"
    permanent: true
    immediate: true
    state: enabled
  notify:
    - Reload firewalld
